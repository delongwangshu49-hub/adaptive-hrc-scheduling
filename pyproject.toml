[project]
name = "adaptive-hrc-scheduling"
version = "0.1.0"
description = "Adaptive human-robot scheduling research: environment scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.9"]
reference = ["ortools==9.15.6755"]

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.3"
default-groups = ["dev", "reference"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
