[project]
name = "p051-desktop-workbench"
version = "0.1.0"
description = "Bilingual native Kit and read-only delivered timeline workbench"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6==6.12.0", "PySide6-WebEngine==6.12.0.140"]

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.3"

[tool.uv.build-backend]
module-name = "p051_desktop"
